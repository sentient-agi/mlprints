---
seed: 42

algo:
  name: fpedit
  params:
    num_fingerprints: 8
    output_dir: "experiments/models/fp_edit"
    # Path to [query, response] pairs (JSON list of 2-item arrays)
    fp_pairs_path: "data/baselines/fp_edit_fingerprints.json"

    # Template must contain a single "{}" for the subject insertion
    prompt_template: "{}"


  models_dict:
    base:
      model_id: meta-llama/Llama-3.2-1B-Instruct
      device_map: cuda:0

  alpha_edit:
    device: "cuda:0"
    projection_device: "cuda:0"
    cache_device: "cpu"
    dtype: "float32"
    hparams:
      model_name: "Llama-3.2-1B-Instruct"
      layers: [3, 4, 5]
      clamp_norm_factor: 0.75
      layer_selection: "all"
      fact_token: "subject_last"
      v_num_grad_steps: 25
      v_lr: 1e-1
      v_loss_layer: 15
      v_weight_decay: 0.5
      kl_factor: 0.0625
      mom2_adjustment: true
      mom2_update_weight: 15000
      rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
      layer_module_tmp: "model.layers.{}"
      mlp_module_tmp: "model.layers.{}.mlp"
      attn_module_tmp: "model.layers.{}.self_attn"
      ln_f_module: "model.norm"
      lm_head_module: "lm_head"
      mom2_dataset: "wikipedia"
      mom2_n_samples: 100000
      mom2_dtype: "float32"
      nullspace_threshold: 2e-2
      L2: 10