---
seed: 42

algo:
  name: perinucleus
  params:

    num_fingerprints: 4
    response_length: 10
    width: 1024
    max_query_tokens: 16
    response_length: 1
    key_gen_temp: 0

    training:
      learning_rate: 2e-5
      early_stopping_loss: 0.005
      per_dev_batch_size: 8
      grad_acc: 1
      output_dir: "experiments/models/test"

    models_dict:
      base:
        model_id: meta-llama/Llama-3.2-1B
        device_map: cuda:1
      
      key_gen:
        model_id: meta-llama/Llama-3.1-8B-Instruct
        device_map: cuda:0
