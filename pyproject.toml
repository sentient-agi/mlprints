[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlprints"
version = "0.1.0b12"
requires-python = ">=3.12"
authors = [
    { name = "Edoardo Contente", email = "edoardo@sentient.xyz" },
    { name = "Anshul Nasery", email = "anasery@cs.washington.edu" },
    { name = "Alkin Kaz", email = "akaz@princeton.edu" },
    { name = "Aidan Phillips", email = "aidan.phillips@baseten.co" }
]
description = "A state-of-the-art framework for LLM fingerprinting and adversarial testing"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE*"]
keywords = [
    "llm",
    "fingerprinting",
    "watermarking",
    "llm-fingerprinting",
    "llm-watermarking",
    "model-fingerprinting",
    "model-watermarking",
    "adversarial-testing",
    "adversarial-attacks",
    "red-teaming",
    "machine-learning",
    "security",
    "transformers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aenum",
    "datasets",
    "deepspeed",
    "kernels>=0.16,<0.17",
    "lighteval[extended-tasks]>=0.13.0",
    "numpy",
    "pyyaml",
    "requests",
    "torch",
    "tqdm",
    "transformers>=5",
    "xxhash<4",
]

[project.scripts]
mlprints = "mlprints.cli:main"

[project.urls]
Homepage = "https://sentient-agi.github.io/mlprints"
Repository = "https://github.com/sentient-agi/mlprints"
Documentation = "https://github.com/sentient-agi/mlprints#readme"
Issues = "https://github.com/sentient-agi/mlprints/issues"

[tool.uv]
exclude-newer = "14 days" # ignore newest releases for safety
# LightEval 0.13 pins nltk==3.9.1; override to a patched release until upstream
# loosens that pin
override-dependencies = [
    "nltk>=3.10.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlprints*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
